<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLO 冷卻模式模擬器</title>
<style>
  :root {
    --bg:#0f172a; --card:#1e293b; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8;
    --on:#22c55e; --off:#64748b; --mod:#f59e0b; --warn:#ef4444;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; font-family:"Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--txt); padding:24px;
  }
  #stage { transform-origin:top left; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .wrap { display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:960px; margin:0 auto; }
  @media(max-width:760px){ .wrap{grid-template-columns:1fr;} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  /* 版面：左右填滿、輸入/判斷並排 */
  .diagram-card { margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media(max-width:820px){ .grid{ grid-template-columns:1fr; } }
  /* 桌機：自動壓縮到單一頁面（限圖高、縮邊距） */
  @media(min-width:821px){
    html, body { overflow:hidden; }
    body { padding:0; }
    #stage { position:absolute; top:0; left:0; width:1280px; padding:16px 24px; }
    h1 { font-size:18px; margin:0 0 2px; }
    .sub { margin-bottom:8px; font-size:12px; }
    .diagram-card { margin-bottom:12px; }
    .diagram-card .svg-scroll svg { width:100%; height:auto; }
    .grid { gap:16px; }
    .card { padding:14px; }
    .card h2 { margin-bottom:10px; }
    .ctrl { margin-bottom:10px; }
    .mode-banner { padding:12px; margin-bottom:12px; font-size:20px; }
    .cico-wrap { margin-top:10px; }
    .equip-grid .item { padding:5px 2px; }
    footer { margin-top:10px !important; padding-top:6px !important; }
  }
  .card h2 { font-size:14px; margin:0 0 14px; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; }
  .ctrl { margin-bottom:18px; }
  .ctrl label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .ctrl label b { color:var(--accent); }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .row { display:flex; align-items:center; gap:10px; }
  input[type=number]{
    width:80px; background:var(--bg); border:1px solid var(--line);
    color:var(--txt); border-radius:6px; padding:6px; font-size:14px;
  }
  .toggle { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; }
  /* 即時天氣帶入 */
  .btn { background:var(--accent); color:#0b1220; border:none; border-radius:8px;
         padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; margin-top:14px; }
  .btn:hover { filter:brightness(1.08); }
  .btn:disabled { opacity:.55; cursor:default; }
  .wstatus { display:block; margin-top:8px; font-size:12px; color:var(--muted); line-height:1.7; }
  /* LIVE 即時徽章 */
  .live-badge { display:none; align-items:center; gap:6px; padding:3px 10px 3px 8px;
                border-radius:999px; background:#7f1d1d33; border:1px solid #ef4444;
                color:#fca5a5; font-size:13px; font-weight:700; letter-spacing:1px; vertical-align:middle; }
  .live-badge.show { display:inline-flex; }
  .live-badge .dot { width:8px; height:8px; border-radius:50%; background:#ef4444;
                     box-shadow:0 0 0 0 #ef444488; animation:livePulse 1.4s ease-out infinite; }
  @keyframes livePulse {
    0%   { box-shadow:0 0 0 0 #ef4444aa; }
    70%  { box-shadow:0 0 0 7px #ef444400; }
    100% { box-shadow:0 0 0 0 #ef444400; }
  }
  @media (prefers-reduced-motion: reduce){ .live-badge .dot { animation:none !important; } }
  .mode-banner {
    text-align:center; padding:20px; border-radius:12px; margin-bottom:16px;
    font-size:22px; font-weight:700; border:2px solid;
  }
  .mode-sub { font-size:12px; font-weight:400; color:var(--muted); margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:8px 6px; border-bottom:1px solid var(--line); }
  td:first-child { color:var(--muted); }
  .pill {
    display:inline-block; padding:3px 10px; border-radius:999px;
    font-size:12px; font-weight:600; color:#0b1220;
  }
  .p-on{background:var(--on);} .p-off{background:var(--off);color:#fff;}
  .p-mod{background:var(--mod);} .p-warn{background:var(--warn);color:#fff;}
  .cond { font-size:12px; color:var(--muted); line-height:1.7; margin-top:10px; }
  .cond code { color:var(--accent); }

  .cico-wrap { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
  @media(max-width:520px){ .cico-wrap{ grid-template-columns:1fr; } }
  .cico { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .cico h3 { font-size:12px; margin:0 0 8px; text-transform:uppercase; letter-spacing:.5px; }
  .cico.in h3 { color:#22c55e; }
  .cico.out h3 { color:#f59e0b; }
  .cico ul { margin:0; padding-left:18px; font-size:12px; color:var(--txt); line-height:1.85; min-height:67px; }   /* 預留 3 項高度，各模式等高 */
  .cico-remark { margin-top:10px; min-height:21px; font-size:12px; color:var(--muted); line-height:1.7; }
  .cico-remark b { color:var(--accent); }

  .equip-grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(4,auto);
                grid-auto-flow:column; gap:2px 22px; }
  @media(max-width:520px){ .equip-grid{ grid-template-columns:1fr; grid-template-rows:none; grid-auto-flow:row; } }
  .equip-grid .item { display:flex; justify-content:space-between; align-items:center;
                      gap:8px; padding:7px 2px; border-bottom:1px solid var(--line); font-size:13px; }
  .equip-grid .item .k { color:var(--muted); }

  /* SVG 風路圖 */
  svg { width:100%; height:auto; display:block; }
  .flow { fill:none; stroke-width:5; stroke-linecap:round; stroke-linejoin:round;
          stroke-dasharray:12 14; animation:dash 1.1s linear infinite;
          transition:opacity .45s ease-in-out; }
  @keyframes dash { to { stroke-dashoffset:-26; } }
  /* 氣流速度分層：送風快、回風慢、洩壓最慢 */
  #flowSupply .flow, #flowRackUp .flow { animation-duration:.75s; }
  #flowRackExhaust .flow { animation-duration:1.15s; }
  #flowReturnLeft .flow, #flowReturnFull .flow, #flowMix .flow { animation-duration:1.7s; }
  #flowRelief .flow { animation-duration:2.4s; }
  /* 機櫃進/排風線條調細，避免蓋住機櫃細節 */
  #flowRackUp .flow, #flowRackExhaust .flow { stroke-width:3.5; }
  .off { opacity:0 !important; }
  /* 機櫃運行 LED：藍燈隨機閃爍（活動）、綠燈慢呼吸（電源）；每台 --rk 錯開時間（class 選取才能套用到 use 实例） */
  .led-a { animation:ledBlink 1.8s steps(1,end) infinite; animation-play-state:var(--run,running); }
  .led-p { animation:ledPulse 2.6s ease-in-out infinite; animation-play-state:var(--run,running); }
  @keyframes ledBlink { 0%,100%{opacity:1} 22%{opacity:.12} 44%{opacity:1} 60%{opacity:.12} 78%{opacity:1} }
  @keyframes ledPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  /* 點擊機櫃切換電源：關機時 LED 熄滅（轉深灰並停止閃爍），機箱維持原亮度（--變數會穿透 use） */
  use.rack { cursor:pointer; }
  use.rack-off { --run:paused; --ledp:#2b3140; --leda:#2b3140; --pdu:#3a2323; }
  .fan-spin { transform-box:fill-box; transform-origin:center; animation:spin 1.4s linear infinite; }
  .fan-stop { animation:none; }
  /* 風扇轉速依模式：機械冷卻（Recirc/Trim）轉快 */
  #ahuFans.spin-fast .fan-spin { animation-duration:.6s; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* 盤管冷卻呼吸光暈 */
  #coil { transition:fill .5s, stroke .5s; }
  .coil-cooling { animation:coilGlow 1.9s ease-in-out infinite; }
  @keyframes coilGlow {
    0%,100% { filter:drop-shadow(0 0 1px #38bdf8); }
    50%     { filter:drop-shadow(0 0 6px #38bdf8); }
  }
  .mix-pulse { animation: mixpulse 1.3s ease-in-out infinite; }
  @keyframes mixpulse { 0%,100%{ fill-opacity:.14; } 50%{ fill-opacity:.42; } }
  .steam { transform-box:fill-box; transform-origin:center; animation: steam 2.6s ease-out infinite; }
  @keyframes steam {
    0%   { transform:translateY(0) scale(.5);  opacity:0; }
    25%  { opacity:.5; }
    100% { transform:translateY(-40px) scale(1.4); opacity:0; }
  }
  .blade { fill:#e2e8f0; stroke:none;
           transform-box:fill-box; transform-origin:center;
           transition:transform .5s cubic-bezier(.45,0,.15,1); }
  .frame { fill:#0b1220; stroke-width:1.5; transition:stroke .3s; }
  .unit { transition:fill .3s, stroke .3s; }
  .lbl { fill:#cbd5e1; font-size:11px; font-family:"Segoe UI",sans-serif; }
  .lbl-sm { fill:#94a3b8; font-size:10px; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
  .legend i{ width:14px; height:4px; border-radius:2px; display:inline-block; }
  @media (prefers-reduced-motion: reduce){
    .flow, .fan-spin, .steam, .coil-cooling { animation:none !important; }
  }

  /* SVG 可捲動容器（小螢幕保持可讀） */
  .svg-scroll { width:100%; }
  /* 桌機縮放版面不換行避免拖動跳動；手機恢復可換行以免截斷讀值 */
  @media(max-width:820px){ #condWrap{ white-space:normal; overflow:visible; text-overflow:clip; } }
  /* ===== 手機版優化 ===== */
  @media(max-width:600px){
    body { padding:12px; }
    h1 { font-size:18px; }
    .sub { font-size:12px; margin-bottom:14px; }
    .card { padding:14px; }
    .card h2 { font-size:13px; }
    /* 風路圖橫向捲動，維持圖內文字可讀 */
    .svg-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch;
                  border:1px solid var(--line); border-radius:8px; }
    .svg-scroll svg { min-width:560px; }
    /* 觸控放大：滑桿與數字框 */
    input[type=range]{ height:30px; }
    input[type=number]{ width:92px; font-size:16px; padding:8px; }
    .ctrl label { font-size:14px; }
    .toggle { font-size:14px; }
    .mode-banner { font-size:19px; padding:16px; }
    table td, .equip-grid .item { font-size:14px; }
  }
</style>
</head>
<body>
<div id="stage">
  <h1>COLO 冷卻模式模擬器</h1>
  <div class="sub">調整 OAT / OADP / OARH（優先級 OAT＞OADP＞OARH），即時判斷運轉模式，底圖依模式顯示風門開合與氣流方向。</div>

  <!-- 風路示意圖 -->
  <div class="card diagram-card">
    <h2 style="display:flex; align-items:center; gap:12px; flex-wrap:nowrap; overflow:hidden;">風路示意圖
      <span id="liveBadge" class="live-badge"><span class="dot"></span>LIVE</span>
      <span id="diagramMode" style="flex:none; padding:4px 14px; border-radius:999px; font-size:14px; font-weight:700; border:2px solid; letter-spacing:.5px;">—</span>
      <span id="diagramCond" style="flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; font-weight:400; color:var(--muted); line-height:1.6;"></span>
    </h2>
    <div class="svg-scroll">
    <svg viewBox="0 74 1000 486" role="img" aria-label="AHU 風路圖">
      <!-- 機房外框 -->
      <rect x="40" y="90" width="920" height="340" rx="6" fill="none" stroke="#475569" stroke-width="2"/>
      <!-- 天花板夾層（回風靜壓區）：僅在 RAD(x315)～PD(x842) 之間，上下界與風門切齊（y136–198）；熱回風區淡紅底 -->
      <rect id="plenumTint" x="315" y="136" width="527" height="62" fill="#ef4444" fill-opacity="0.14"/>
      <line x1="315" y1="136" x2="842" y2="136" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="315" y1="198" x2="842" y2="198" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="578" y="424" text-anchor="middle" class="lbl-sm">資料機房空間 (Data Hall)</text>

      <!-- 空間分隔牆 -->
      <g stroke="#475569" stroke-width="2" stroke-linecap="round">
        <!-- 空調機房 / 資料機房 分隔（牆頂上延到夾層頂 136 封住靜壓區左端；RAD 為牆上開口，中間留側送風開口） -->
        <line x1="315" y1="136" x2="315" y2="300"/>
        <line x1="315" y1="360" x2="315" y2="430"/>
        <!-- 資料機房 / 走道 分隔（牆頂上延到夾層頂 136 封住靜壓區右端；PD 為牆上開口） -->
        <line x1="842" y1="136" x2="842" y2="430"/>
      </g>
      <text x="177" y="424" text-anchor="middle" class="lbl-sm">MECH Gallery</text>

      <!-- 冷區：資料機房冷通道（底部冷送風 + 機櫃列兩側冷通道），淡藍色塊與熱區區分，置最底層 -->
      <rect x="315" y="360" width="527" height="68" rx="4" fill="#3b82f6" fill-opacity="0.10"/>
      <rect x="315" y="198" width="74" height="162" rx="4" fill="#3b82f6" fill-opacity="0.10"/>
      <rect x="769" y="198" width="73" height="162" rx="4" fill="#3b82f6" fill-opacity="0.10"/>

      <!-- 再循環熱回風區（僅 RECIRC：回風全數導回 AHU 進氣側，含回風下降通道至 RAD 牆），置最底層 -->
      <rect id="hotRecirc" class="off" x="96" y="140" width="219" height="282" rx="6" fill="#ef4444" fill-opacity="0.14" style="opacity:0"/>
      <!-- 走道洩壓熱排區（PD 開啟時：熱風經 PD 排入整個走道空間） -->
      <rect id="hotCorridor" class="off" x="846" y="100" width="112" height="322" rx="6" fill="#ef4444" fill-opacity="0.14" style="opacity:0"/>
      <!-- 混風熱交換區（僅 MIXING：熱回風與冷外氣同一空間混合，紅↔藍漸層做出熱交換） -->
      <rect id="hotMix" class="off" x="96" y="140" width="219" height="282" rx="6" fill="url(#mixGrad)" style="opacity:0"/>
      <!-- MECH Gallery 冷區（平時 FREE／TRIM：OAD 引入冷外氣、RAD 全閉） -->
      <rect id="coldMech" class="off" x="96" y="140" width="219" height="282" rx="6" fill="#3b82f6" fill-opacity="0.12" style="opacity:0"/>

      <!-- ===== 氣流（底層）===== -->
      <!-- 外氣進氣 (藍) -->
      <g id="flowOA">
        <polyline class="flow" stroke="#3b82f6" marker-end="url(#mBlue)" points="10,240 52,240"/>
        <polyline class="flow" stroke="#3b82f6" marker-end="url(#mBlue)" points="10,280 52,280"/>
        <polyline class="flow" stroke="#3b82f6" marker-end="url(#mBlue)" points="10,320 52,320"/>
        <polyline class="flow" stroke="#3b82f6" marker-end="url(#mBlue)" points="10,360 52,360"/>
        <polyline class="flow" stroke="#3b82f6" marker-end="url(#mBlue)" points="72,348 200,348"/>
        <polyline class="flow" stroke="#3b82f6" marker-end="url(#mBlue)" points="72,398 200,398"/>
      </g>
      <!-- 混風循環（僅混風冷卻）：圓形（rx36/ry66 補償畫面垂直壓縮），左熱往下、右冷往上 -->
      <g id="flowMix">
        <path id="flowMixHot" class="flow" stroke="#ef4444" marker-end="url(#mRed)" fill="none" d="M156,228 A36,66 0 0 0 156,360"/>
        <path class="flow" stroke="#3b82f6" marker-end="url(#mBlue)" fill="none" d="M156,360 A36,66 0 0 0 156,228"/>
      </g>

      <!-- 送風：AHU 側出風 → 沿機房地面分送至各機櫃（僅側向，無向下段） -->
      <g id="flowSupply">
        <polyline class="flow" stroke="#3b82f6" points="315,330 356,330"/>
        <polyline class="flow" stroke="#3b82f6" marker-end="url(#mBlue)" points="315,390 812,390"/>
      </g>

      <!-- 熱通道封閉：封頂於夾層頂(y136)、封底於夾層底(y198)，封底由 RACK 兩側封到牆、中間留排熱口 -->
      <g id="hotAisle">
        <!-- 封閉熱通道熱區淡紅底（機櫃頂 → 機櫃底 y360）；依運轉台數淡化、全關轉冷區 -->
        <rect id="hotAisleTint" x="389" y="198" width="380" height="162" fill="#ef4444" fill-opacity="0.14"/>
        <!-- 封頂：夾層頂緣，RAD(x315)～PD(x842) -->
        <rect x="315" y="133" width="527" height="6" rx="2" fill="#1e293b" stroke="#7c8698" stroke-width="1.5"/>
        <!-- 封底：夾層底緣，由 RACK 兩側封到牆（MECH x315 / 走道 x842），中間留排熱開口 -->
        <rect x="315" y="195" width="74" height="6" rx="2" fill="#1e293b" stroke="#7c8698" stroke-width="1.5"/>
        <rect x="769" y="195" width="73" height="6" rx="2" fill="#1e293b" stroke="#7c8698" stroke-width="1.5"/>
        <!-- RACK 群最左/最右端封板：夾層底(198) 封到機櫃底(360)，與機櫃底切齊，封閉熱通道兩端 -->
        <rect x="383" y="198" width="6" height="162" rx="2" fill="#1e293b" stroke="#7c8698" stroke-width="1.5"/>
        <rect x="769" y="198" width="6" height="162" rx="2" fill="#1e293b" stroke="#7c8698" stroke-width="1.5"/>
        <text x="578" y="172" text-anchor="middle" class="lbl-sm" fill="#fca5a5">熱通道封閉</text>
      </g>

      <!-- 熱通道排出 (紅)：由機櫃頂上排至回風靜壓區 -->
      <g id="flowRackExhaust">
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="408,256 408,188"/>
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="446,256 446,188"/>
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="484,256 484,188"/>
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="522,256 522,188"/>
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="560,256 560,188"/>
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="598,256 598,188"/>
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="636,256 636,188"/>
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="674,256 674,188"/>
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="712,256 712,188"/>
        <polyline class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="750,256 750,188"/>
      </g>
      <!-- 回風返回 (紅)：橫向穿過 RAD → 降到 DOAS 下方 → 導引至混氣區（僅混風） -->
      <polyline id="flowReturnLeft" class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="803,156 295,156 295,206 156,206 156,224"/>
      <!-- 回風完整回到 AHU 左側（僅再循環） -->
      <polyline id="flowReturnFull" class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="803,156 295,156 295,206 156,206 156,360 208,360"/>
      <!-- 洩壓排氣 (紅)：熱風沿靜壓區向右匯集 → 穿過 PD 進入走道再往下排出 -->
      <polyline id="flowRelief" class="flow" stroke="#ef4444" marker-end="url(#mRed)" points="353,176 895,176 895,340 946,340"/>

      <!-- ===== 設備 ===== -->
      <!-- OAD (MD.1) 外氣風門 -->
      <g id="oad">
        <rect class="frame unit" x="56" y="210" width="16" height="190" stroke="#ef4444"/>
        <rect class="blade" x="57" y="214" width="14" height="3" rx="1.5"/>
        <rect class="blade" x="57" y="228" width="14" height="3" rx="1.5"/>
        <rect class="blade" x="57" y="242" width="14" height="3" rx="1.5"/>
        <rect class="blade" x="57" y="256" width="14" height="3" rx="1.5"/>
        <rect class="blade" x="57" y="270" width="14" height="3" rx="1.5"/>

      <div class="equip-grid" id="equip"></div>

        <div class="cico in"><h3>切入條件 Cut-in</h3><ul id="cutIn"></ul></div>
        <div class="cico out"><h3>切出條件 Cut-off</h3><ul id="cutOut"></ul></div>

      <span>版本：V3.28</span>
    </div>
  </footer>
</div><!-- /#stage -->

<script>
// 色彩常數集中管理（熱/冷、熱區透明度）
const PALETTE = {
  hot:  [0xef,0x44,0x44], hotHex: "#ef4444",
  cold: [0x3b,0x82,0xf6], coldHex:"#3b82f6",
  hotTintOp: 0.14, coldTintOp: 0.12
};
// 設備狀態對照表
const MODES = {
  MIXING: {
    name:"MIXING COOLING", zh:"混風冷卻", color:"#38bdf8",
    equip:{ "MD.1 (OAD)":"OPEN","MD.2 (ON DOAS)":"CLOSED","MD.3 (RAD)":"MODULATING BY RH",
      "MD.4 (PD)":"OPEN","COLO AHU FAN":"ON","COLO AHU PICV":"CLOSED","DOAS":"OFF","CHILLER PLANT":"DISABLE" },
    cutIn:["OAT < 32°C","且 OADP < 28°C","且 OARH > 80%"],
    cutOut:["OAT < 31°C","且 OADP < 27°C","且 OARH < 75%"],
    remark:"由 Free Cooling 切入"
  },
  FREE: {
    name:"FREE COOLING", zh:"自然冷卻", color:"#22c55e",
    equip:{ "MD.1 (OAD)":"OPEN","MD.2 (ON DOAS)":"CLOSED","MD.3 (RAD)":"FULLY CLOSED",
      "MD.4 (PD)":"OPEN","COLO AHU FAN":"ON","COLO AHU PICV":"CLOSED","DOAS":"OFF","CHILLER PLANT":"DISABLE" },
    cutIn:["OAT < 32°C","且 OADP < 28°C","且 OARH < 80%"],
    cutOut:["—"],
    remark:""
  },
  TRIM: {
    name:"TRIM COOLING", zh:"輔助冷卻", color:"#f59e0b",
    equip:{ "MD.1 (OAD)":"OPEN","MD.2 (ON DOAS)":"CLOSED","MD.3 (RAD)":"FULLY CLOSED",
      "MD.4 (PD)":"OPEN","COLO AHU FAN":"ON","COLO AHU PICV":"MODULATING","DOAS":"OFF","CHILLER PLANT":"ENABLE" },
    cutIn:["OAT > 32°C","且 OADP < 28°C"],
    cutOut:["OAT < 31°C","且 OADP < 27°C","且 OARH < 75%"],
    remark:"由 Free / Mixing Cooling 切入；切出回 Free Cooling"
  },
  RECIRC: {
    name:"RECIRCULATION", zh:"再循環", color:"#ef4444",
    equip:{ "MD.1 (OAD)":"CLOSED","MD.2 (ON DOAS)":"OPEN","MD.3 (RAD)":"FULLY OPEN",
      "MD.4 (PD)":"CLOSED","COLO AHU FAN":"ON","COLO AHU PICV":"MODULATING","DOAS":"ON","CHILLER PLANT":"ENABLE" },
    cutIn:["OAT > 45.5°C","或 OADP > 28°C"],
    cutOut:["OAT < 44.5°C","或 OADP < 27°C"],
    remark:"颱風期間手動啟用"
  }
};

// 目前模式（含 cut-off 遲滞記憶）
let currentMode = "FREE";

// 冷卻模式的 cut-in 選擇（嚴格 >/<，不含 recirc）
function coolingByCutIn(oat, oadp, oarh){
  if (oat > 32 && oadp < 28) return "TRIM";
  if (oat < 32 && oadp < 28 && oarh > 80) return "MIXING";
  if (oat < 32 && oadp < 28 && oarh < 80) return "FREE";
  return currentMode; // 邊界：維持現狀
}

// 初始模式（cut-in，邊界用 ≥/≤ 避免空隙）
function initialMode(oat, oadp, oarh, typhoon, forceTrim){
  if (typhoon) return "RECIRC";
  if (forceTrim) return "TRIM";
  if (oat >= 45.5 || oadp > 28) return "RECIRC";
  if (oat >= 32 && oadp <= 28) return "TRIM";
  if (oat < 32 && oadp <= 28) return oarh > 80 ? "MIXING" : "FREE";
  return "RECIRC";
}

// 依嚴格 >/< 的 cut-in / cut-off 與遲滞記憶決定下一模式
function nextMode(cur, oat, oadp, oarh, typhoon, forceTrim){
  if (typhoon) return "RECIRC";              // 颱風手動（最高）
  if (forceTrim) return "TRIM";              // 手動強制 Trim
  // Recirc cut-in：OAT > 45.5 或 OADP > 28
  if (oat > 45.5 || oadp > 28) return "RECIRC";
  switch (cur){
    case "RECIRC":
      // Recirc cut-off：OAT < 44.5 或 OADP < 27 → 離開（依 cut-in 選冷卻模式）
      if (oat < 44.5 || oadp < 27) return coolingByCutIn(oat, oadp, oarh);
      return "RECIRC"; // 44.5~45.5 / 27~28 遲滞區間維持
    case "TRIM":
      // Trim cut-off：OAT < 31 且 OADP < 27 且 OARH < 75 → Free
      if (oat < 31 && oadp < 27 && oarh < 75) return "FREE";
      return "TRIM";
    case "MIXING":
      // Mixing cut-off：OAT < 31 且 OADP < 27 且 OARH < 75 → Free
      if (oat < 31 && oadp < 27 && oarh < 75) return "FREE";
      // Trim cut-in：OAT > 32 且 OADP < 28 → Trim
      if (oat > 32 && oadp < 28) return "TRIM";
      return "MIXING";
    case "FREE":
      // Free 無自身 cut-off，依其他模式 cut-in 切換
      if (oat > 32 && oadp < 28) return "TRIM";                 // Trim cut-in
      if (oat < 32 && oadp < 28 && oarh > 80) return "MIXING";  // Mixing cut-in
      return "FREE";
    default:
      return coolingByCutIn(oat, oadp, oarh);
  }
}

// 風門：OPEN=紅框、CLOSE=灰框、MODULATING=橘框（對應圖例）
function stateColor(v){
  if (["ON","OPEN","FULLY OPEN","ENABLE"].includes(v)) return "#ef4444";
  if (["OFF","CLOSED","FULLY CLOSED","DISABLE"].includes(v)) return "#94a3b8";
  if (v.indexOf("MODULATING") === 0) return "#f59e0b";
  return "#94a3b8";
}
function pillClass(v){
  if (["ON","OPEN","FULLY OPEN","ENABLE"].includes(v)) return "p-on";
  if (["OFF","CLOSED","FULLY CLOSED","DISABLE"].includes(v)) return "p-off";
  if (v.indexOf("MODULATING") === 0) return "p-mod";
  return "p-off";
}
// 風門葉片角度：開=近平行(通過) 調變=半開 關=近垂直(阻擋)
function damperAngle(v){
  if (["OPEN","FULLY OPEN"].includes(v)) return 12;
  if (v.indexOf("MODULATING") === 0) return 48;
  return 82;
}

function $(id){ return document.getElementById(id); }

function setDamper(id, v){
  const g = $(id);
  const c = stateColor(v);
  g.querySelector(".frame").setAttribute("stroke", c);
  const ang = damperAngle(v);
  g.querySelectorAll(".blade").forEach((b,i)=>{
    b.style.transform = `rotate(${ang}deg)`;
    b.style.transitionDelay = (i*40) + "ms";
    b.setAttribute("fill", c);
  });
}
function setFlow(id, on, opacity=1){
  const el = $(id);
  el.classList.toggle("off", !on);
  el.style.opacity = on ? opacity : 0;
}

// 目前模式的觸發原因（供結果區顯示）
function reasonText(mode, oat, oadp, oarh, typhoon, forceTrim){
  if (typhoon)   return "颱風核取啟用 → 強制進入<b>再循環</b>（最高優先）。";
  if (forceTrim) return "手動 TRIM 核取啟用 → 強制進入<b>輔助冷卻</b>。";
  switch (mode){
    case "RECIRC": {
      const hits = [];
      if (oat > 45.5) hits.push(`OAT ${oat.toFixed(1)}°C > 45.5°C`);
      if (oadp > 28)  hits.push(`OADP ${oadp.toFixed(1)}°C > 28°C`);
      return hits.length ? ("達再循環切入條件：" + hits.join(" 或 ") + "。")
                         : "維持再循環（介於切入 45.5°C／切出 44.5°C 的遲滞區間）。";
    }
    case "TRIM":
      return (oat > 32 && oadp < 28)
        ? `達 Trim 切入：OAT ${oat.toFixed(1)}°C > 32°C 且 OADP ${oadp.toFixed(1)}°C < 28°C。`
        : "維持 Trim（未達切出：需 OAT<31°C 且 OADP<27°C 且 OARH<75%）。";
    case "MIXING":
      return (oat < 32 && oadp < 28 && oarh > 80)
        ? `達 Mixing 切入：OAT<32°C、OADP<28°C，且 OARH ${oarh.toFixed(0)}% > 80%。`
        : "維持 Mixing（未達切出）。";
    case "FREE":
      return (oat < 32 && oadp < 28 && oarh < 80)
        ? `達 Free 切入：OAT ${oat.toFixed(1)}°C<32°C、OADP ${oadp.toFixed(1)}°C<28°C、OARH ${oarh.toFixed(0)}%<80%。`
        : "維持 Free（由其他模式切出後回到自然冷卻）。";
  }
  return "";
}

  $("cutIn").innerHTML  = m.cutIn.map(x=>`<li>${x}</li>`).join("");

  $("cutRemark").innerHTML = m.remark ? `<b>Remark：</b>${m.remark}` : "";
  $("modeReason").innerHTML =

    `<div>觸發原因：` + reasonText(currentMode, oat, oadp, oarh, typhoon, forceTrim) + `</div>`;

  // === 更新風路圖 ===
  const e = m.equip;
  setDamper("oad", e["MD.1 (OAD)"]);
  setDamper("md2", e["MD.2 (ON DOAS)"]);

  const doasOn = e["DOAS"] === "ON";

  doasBox.setAttribute("fill", doasOn ? "#3a1414" : "#334155");
  doasBox.setAttribute("stroke", doasOn ? "#ef4444" : "#94a3b8");

  const coilMod = e["COLO AHU PICV"].indexOf("MODULATING") === 0;
  const coil = $("coil");
  coil.setAttribute("fill", coilMod ? "#0c4a6e" : "#334155");
  coil.setAttribute("stroke", coilMod ? "#38bdf8" : "#64748b");
  coil.classList.toggle("coil-cooling", coilMod);   // 冷卻中呼吸光暈

  const fanOn = e["COLO AHU FAN"] === "ON";
  const mech  = e["CHILLER PLANT"] === "ENABLE";     // 機械冷卻→風扇轉快
  $("ahuFans").classList.toggle("spin-fast", mech && fanOn);
  $("ahuFans").querySelectorAll(".fan").forEach(f=>f.classList.toggle("fan-stop", !fanOn));
  $("ahuFans").querySelectorAll(".fan-ring").forEach(r=>r.setAttribute("stroke", fanOn ? "#22c55e" : "#64748b"));

  const radState = e["MD.3 (RAD)"];
  const radOpen = radState !== "FULLY CLOSED" && radState !== "CLOSED";
  const radMod  = radState.indexOf("MODULATING") === 0;
  setFlow("flowOA",         e["MD.1 (OAD)"] !== "CLOSED");   // 外氣進氣
  setFlow("flowMix",        radMod);                          // 混風循環圈（僅混風冷卻）
  setFlow("flowSupply",     fanOn);                           // 地板下送風
  setFlow("flowRackUp",     fanOn);                           // 冷通道上送
  setFlow("flowRackExhaust",fanOn);                           // 熱通道排出
  setFlow("flowReturnLeft", radMod, 0.6);                     // 混風：回風導引至混氣區
  setFlow("flowReturnFull", radState === "FULLY OPEN");       // 再循環：回風完整回到 AHU 左側
  setFlow("coldMech",       radState === "FULLY CLOSED", 1); // 平時 FREE／TRIM：MECH Gallery 為冷外氣進氣區
  setFlow("flowRelief",     e["MD.4 (PD)"] === "OPEN");       // 洩壓排氣

  // 依運轉機櫃數（IT 熱負載）調整所有模式熱區：每關一台變淡、全關轉冷區；關機機櫃停止排熱
  const frac = applyRackExhaust();
  paintHeat("hotAisleTint", true,                      frac);                     // 資料機房熱通道
  paintHeat("plenumTint",   true,                      frac);                     // 回風靜壓區
  paintHeat("hotRecirc",    radState === "FULLY OPEN", frac);                     // 再循環：MECH 進氣側熱回風
  paintHeat("hotMix",       radMod,                    frac, "url(#mixGrad)", 1); // 混風熱交換
  paintHeat("hotCorridor",  e["MD.4 (PD)"] === "OPEN", frac);                     // 走道洩壓熱排
  tintHotFlows(frac);   // 主要熱風流動（回風/洩壓/混風熱段/剖面排熱）依運轉比例紅↔藍
  const ih = $("insetHot"); if (ih) ih.setAttribute("fill", hotColor(frac));   // 剖面圖中間熱通道同步

  // 冰水主機系統（Chiller Plant）
  const chillerOn = e["CHILLER PLANT"] === "ENABLE";
  ["flowWaterRet","flowWaterSup","flowCondOut","flowCondIn","towerSteam"].forEach(id=>setFlow(id, chillerOn));
  $("chillerSys").style.opacity = chillerOn ? 1 : 0.4;
  $("chillerBox").setAttribute("stroke", chillerOn ? "#22c55e" : "#475569");
  $("towerBox").setAttribute("stroke", chillerOn ? "#22c55e" : "#475569");
}

// ===== 濕空氣（Psychrometric）聯動 =====
// Magnus 公式（對水面），T 單位 °C
function esat(T){ return 6.112 * Math.exp(17.62 * T / (243.12 + T)); }
// 由 T、RH 計算露點 DP
function calcDP(T, RH){
  RH = Math.min(100, Math.max(0.5, RH));
  const e = (RH / 100) * esat(T);
  const ln = Math.log(e / 6.112);
  return 243.12 * ln / (17.62 - ln);
}
// 由 T、DP 計算相對濕度 RH
function calcRH(T, DP){
  return Math.min(100, Math.max(0, 100 * esat(DP) / esat(T)));
}
// 由水氣分壓 e (hPa) 反算露點 DP
function dpFromE(e){
  const ln = Math.log(Math.max(e, 1e-6) / 6.112);
  return 243.12 * ln / (17.62 - ln);
}
// 寫入 slider + number（依範圍夾限；非數值防呆）
function writeVal(sliderId, numId, val, dec){
  const s = $(sliderId), n = $(numId);
  if (!isFinite(val)) val = parseFloat(s.value);              // 防呆：非數值時沿用目前有效值
  if (!isFinite(val)) val = parseFloat(s.min) || 0;           // 連 slider 也無效→退回下限
  let v = dec ? Math.round(val * 10) / 10 : Math.round(val);
  v = Math.min(parseFloat(s.max), Math.max(parseFloat(s.min), v));
  s.value = v; n.value = v;
}
function num(id){ return parseFloat($(id).value); }

// 手動調整參數→隱藏已帶入的天氣，還原顯示目前條件（二選一）
let liveTimer = null;   // LIVE 自動解除計時器
function clearLive(){
  clearTimeout(liveTimer);
  $("weatherStatus").innerHTML = "";
  $("weatherStatus").style.display = "none";
  $("condText").style.display = "inline";
  $("liveBadge").classList.remove("show");
}

// 優先級 OAT > OADP > OARH：OAT、OADP 為主，OARH 為衍生
// 修改 OAT：先依現況算出絕對濕度（水氣密度，不顯示）並維持不變，再自動重算 OADP/OARH
// → ρv = e/(Rv·T)，維持 ρv 定値則水氣分壓 e 隨絕對溫度 T(K) 等比變化
function editOAT(v){
  if (!isFinite(v)) return;                          // 防呆：空值/非數字→不更新（保留上一次有效狀態）
  const oldT = num("oat");
  const ah = esat(num("oadp")) / (oldT + 273.15);   // 現況絕對濕度（略去常數 Rv，等比即可）
  writeVal("oat", "oatNum", v, true);
  const newT = num("oat");
  let e1 = Math.min(ah * (newT + 273.15), esat(newT));   // 維持絕對濕度；e ≤ 飽和（RH≤1）
  writeVal("oadp", "oadpNum", Math.min(dpFromE(e1), newT), true);
  writeVal("oarh", "oarhNum", 100 * e1 / esat(newT), false);
  clearLive(); saveParams();
  render();
}
// 修改 RH（最低優先）：保留 OAT（最高），重算 DP
function editRH(v){
  if (!isFinite(v)) return;                          // 防呆：非數值不更新
  writeVal("oarh", "oarhNum", v, false);
  writeVal("oadp", "oadpNum", calcDP(num("oat"), num("oarh")), true);
  clearLive(); saveParams();
  render();
}
// 修改 DP（次高優先）：保留 OAT（最高），重算 OARH（最低）；DP 不可高於 OAT
function editDP(v){
  if (!isFinite(v)) return;                          // 防呆：非數值不更新
  const oat = num("oat");
  writeVal("oadp", "oadpNum", Math.min(oat, v), true);
  writeVal("oarh", "oarhNum", calcRH(oat, num("oadp")), false);
  clearLive(); saveParams();
  render();
}

function bind(ids, handler){
  ids.forEach(id => $(id).addEventListener("input", e => handler(parseFloat(e.target.value))));
}
bind(["oat", "oatNum"], editOAT);
bind(["oarh", "oarhNum"], editRH);
bind(["oadp", "oadpNum"], editDP);
// 數字框失焦防呆：空值/非數字時還原為目前有效值
["oatNum","oadpNum","oarhNum"].forEach(function(numId){
  const sliderId = numId.replace("Num","");
  $(numId).addEventListener("change", function(){
    if (!isFinite(parseFloat($(numId).value))) $(numId).value = $(sliderId).value;
  });
});
$("typhoon").addEventListener("change", function(){ saveParams(); render(); });
$("forceTrim").addEventListener("change", function(){ saveParams(); render(); });

// ===== 即時天氣（Open-Meteo，免金鑰）=====
const SITE = { lat:25.0375, lon:121.3378 };   // 桃園市龜山區約略座標
async function fetchWeather(){
  const status = $("weatherStatus");
  const btn = $("fetchWeather"); btn.disabled = true;
  status.style.display = "inline"; $("condText").style.display = "none";   // 二選一：顯示已帶入，隱藏目前條件
  status.textContent = "查詢中…";
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + SITE.lat +
      "&longitude=" + SITE.lon +
      "&current=temperature_2m,relative_humidity_2m,dew_point_2m&timezone=Asia%2FTaipei";
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const c = data.current || {};
    const t = parseFloat(c.temperature_2m), dp = parseFloat(c.dew_point_2m), rh = parseFloat(c.relative_humidity_2m);
    if (!isFinite(t) || (!isFinite(dp) && !isFinite(rh))) throw new Error("回傳資料無溫濕度");
    writeVal("oat", "oatNum", t, true);
    // 優先級 OAT>OADP>OARH：直接帶入量測露點作 OADP，再推算 OARH
    writeVal("oadp", "oadpNum", isFinite(dp) ? Math.min(num("oat"), dp) : calcDP(num("oat"), rh), true);
    writeVal("oarh", "oarhNum", calcRH(num("oat"), num("oadp")), false);
    render();
    saveParams();
    $("liveBadge").classList.add("show");   // 上方顯示 LIVE
    clearTimeout(liveTimer);                 // 1 分鐘後自動解除 LIVE（資料視為過期）
    liveTimer = setTimeout(function(){ $("liveBadge").classList.remove("show"); }, 60000);
    const time = c.time ? String(c.time).replace("T", " ") : "";
    const clamp = (t < 15) ? "（已依模擬器下限 15°C 夾限）" : "";
    status.innerHTML =
      `已帶入：溫度 <b>${t.toFixed(1)}°C</b>、相對濕度 <b>${rh.toFixed(0)}%</b>${clamp}` +
      (time ? `，觀測時間 ${time}` : "");
  } catch (err){
    status.innerHTML = "取得失敗：" + err.message +
      "。<br>此功能需以 https 網址開啟（如 GitHub Pages）；直接雙擊檔案（file://）會被瀏覽器阻擋。";
  } finally {
    btn.disabled = false;
  }
}
$("fetchWeather").addEventListener("click", fetchWeather);

// ===== 自動更新（每 10 分鐘）=====
let autoTimer = null;
function toggleAuto(){
  clearInterval(autoTimer);
  if ($("autoWeather").checked){
    fetchWeather();                               // 立即抓一次
    autoTimer = setInterval(fetchWeather, 600000); // 每 10 分鐘
  }
  saveParams();
}
$("autoWeather").addEventListener("change", toggleAuto);
$("lockAspect").addEventListener("change", function(){ saveParams(); fitStage(); });

// ===== 記住上次輸入（localStorage）=====
function saveParams(){
  try {
    localStorage.setItem("coloParams", JSON.stringify({
      oat:num("oat"), oadp:num("oadp"),
      typhoon:$("typhoon").checked, forceTrim:$("forceTrim").checked,
      auto:$("autoWeather").checked, lock:$("lockAspect").checked,
      racksOff:Array.prototype.reduce.call(document.querySelectorAll("use.rack"),
        function(a,u,i){ if (u.classList.contains("rack-off")) a.push(i); return a; }, [])
    }));
  } catch(e){}
}
function loadParams(){
  try {
    const p = JSON.parse(localStorage.getItem("coloParams") || "null");
    if (p && isFinite(p.oat)){
      writeVal("oat", "oatNum", p.oat, true);
      // 優先級 OAT>OADP>OARH：復原 OADP（舊檔只存 oarh 時向下相容），再推算 OARH
      if (isFinite(p.oadp)) writeVal("oadp", "oadpNum", Math.min(num("oat"), p.oadp), true);
      else if (isFinite(p.oarh)) writeVal("oadp", "oadpNum", calcDP(num("oat"), p.oarh), true);
      writeVal("oarh", "oarhNum", calcRH(num("oat"), num("oadp")), false);
      $("typhoon").checked = !!p.typhoon;
      $("forceTrim").checked = !!p.forceTrim;
      $("autoWeather").checked = !!p.auto;
      $("lockAspect").checked = !!p.lock;
      if (Array.isArray(p.racksOff)){                       // 還原機櫃開/關狀態
        const racks = document.querySelectorAll("use.rack");
        p.racksOff.forEach(function(i){ if (racks[i]) racks[i].classList.add("rack-off"); });
      }
    }
  } catch(e){}
}

// ===== 自動縮放至單一螢幕（上下左右填滿，設計寬 1902）=====
const stageEl = document.getElementById("stage");
function fitStage(){
  if (!stageEl) return;
  if (window.innerWidth < 821){ stageEl.style.transform = ""; return; }   // 小螢幕不縮放（正常排版）
  stageEl.style.transform = "none";
  const w = 1280, h = stageEl.scrollHeight;
  const sx = window.innerWidth / w;
  const sy = window.innerHeight / h;
  if ($("lockAspect") && $("lockAspect").checked){
    const s = Math.min(sx, sy);                       // 鎖定：等比不變形、置中
    const left = (window.innerWidth  - w * s) / 2;
    const top  = (window.innerHeight - h * s) / 2;
    stageEl.style.transform = "translate(" + left + "px," + top + "px) scale(" + s + ")";
  } else {
    stageEl.style.transform = "scale(" + sx + "," + sy + ")";   // 非等比：完全填滿視窗
  }
}
window.addEventListener("resize", fitStage);
window.addEventListener("load", fitStage);

// 點擊機櫃切換電源開/關 → 重繪並記憶（依運轉台數調整各模式熱區）
Array.prototype.forEach.call(document.querySelectorAll("use.rack"), function(u){
  u.addEventListener("click", function(){ u.classList.toggle("rack-off"); render(); saveParams(); });
});
// 統計運轉機櫃比例；風流動動畫保留不消失，改以顏色表達冷熱（運轉紅、關機藍）；回傳 0..1
function applyRackExhaust(){
  const racks = document.querySelectorAll("use.rack");
  const exhaust = document.querySelectorAll("#flowRackExhaust polyline");
  let active = 0;
  racks.forEach(function(u, i){
    const off = u.classList.contains("rack-off");
    if (!off) active++;
    const ex = exhaust[i];
    if (ex){
      ex.style.opacity = "";                                       // 不消失
      ex.setAttribute("stroke", off ? PALETTE.coldHex : PALETTE.hotHex);   // 關機→藍、運轉→紅
      ex.setAttribute("marker-end", "url(#mFlow)");
    }
  });
  return racks.length ? active / racks.length : 1;
}
// 依運轉比例在藍(0)↔紅(1)間內插顏色
function hotColor(frac){
  const a = PALETTE.cold, b = PALETTE.hot;
  const c = a.map(function(v,i){ return Math.round(v + (b[i]-v)*frac); });
  return "#" + c.map(function(x){ return x.toString(16).padStart(2,"0"); }).join("");
}
// 主要熱風流動（回風/洩壓/混風熱段/剖面排熱）：動畫保留，依 frac 由紅漸變為藍（箭頭 context-stroke 同步）
function tintHotFlows(frac){
  const col = hotColor(frac);
  ["flowReturnLeft","flowReturnFull","flowRelief","flowMixHot","insetExhaust"].forEach(function(id){
    const el = document.getElementById(id);
    if (!el) return;
    el.setAttribute("stroke", col);
    el.setAttribute("marker-end", "url(#mFlow)");
  });
}
// 熱區塗色：active 時依運轉比例 frac 淡化（frac=0 全關 → 轉冷區藍）；非 active 隱藏
function paintHeat(id, active, frac, hotFill, hotOp){
  const el = document.getElementById(id);
  if (!el) return;
  hotFill = hotFill || PALETTE.hotHex;
  hotOp   = hotOp   || PALETTE.hotTintOp;
  el.classList.toggle("off", !active);
  if (!active){ el.style.opacity = 0; return; }
  el.style.opacity = 1;
  if (frac > 0){
    el.setAttribute("fill", hotFill);
    el.setAttribute("fill-opacity", (hotOp * frac).toFixed(3));
  } else {
    el.setAttribute("fill", PALETTE.coldHex);        // 全關 → 熱區轉冷區
    el.setAttribute("fill-opacity", PALETTE.coldTintOp);
  }
}

// 初始化：先載入上次輸入，依優先級 OAT>OADP>OARH 由 OAT+OADP 推算 OARH、設定初始模式
loadParams();
writeVal("oarh", "oarhNum", calcRH(num("oat"), num("oadp")), false);
currentMode = initialMode(num("oat"), num("oadp"), num("oarh"), $("typhoon").checked, $("forceTrim").checked);
render();
fitStage();
if ($("autoWeather").checked) toggleAuto();   // 還原自動更新

// 瀏覽次數計數（abacus，免金鑰）：載入時計數一次並顯示
(function(){
  const el = document.getElementById("viewCount");
  if (!el) return;
  fetch("https://abacus.jasoncameron.dev/hit/chienan822454-cooling-moed/views")
    .then(function(r){ return r.json(); })
    .then(function(d){ if (d && isFinite(d.value)) el.textContent = Number(d.value).toLocaleString(); })
    .catch(function(){ el.textContent = "—"; });
})();
